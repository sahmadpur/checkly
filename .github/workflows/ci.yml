name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkly
          POSTGRES_PASSWORD: checkly
          POSTGRES_DB: checkly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prisma.config.ts resolves DATABASE_URL eagerly at load time (throws if unset), and
      # .env isn't written until the step below, so generate needs a placeholder here — same
      # as the Dockerfile's build stage.
      - run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: PGPASSWORD=checkly psql -h localhost -U checkly -c 'CREATE DATABASE checkly_test;'
      # GitHub service containers can't take a `command`, and MinIO's image needs `server /data`
      # to run (no server subcommand exits immediately), so it's started as a plain docker run
      # step instead of a `services:` entry.
      - run: |
          docker run -d -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio12345 \
            -e MINIO_API_CORS_ALLOW_ORIGIN='*' \
            quay.io/minio/minio server /data
          timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
      # Every key already exists in .env.example, so fill them in place: appending
      # instead would leave two lines per key (last one wins, but it is a trap).
      # The S3_* values in .env.example already match the MinIO container above.
      - run: |
          cp .env.example .env
          keys=$(pnpm --silent push:keys)
          vapid_public=$(printf '%s\n' "$keys" | sed -n 's/^VAPID_PUBLIC_KEY=//p')
          vapid_private=$(printf '%s\n' "$keys" | sed -n 's/^VAPID_PRIVATE_KEY=//p')
          [ -n "$vapid_public" ] && [ -n "$vapid_private" ] || { echo "push:keys produced no VAPID pair"; exit 1; }
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgresql://checkly:checkly@localhost:5432/checkly_test#" .env
          sed -i "s#^DATABASE_URL_TEST=.*#DATABASE_URL_TEST=postgresql://checkly:checkly@localhost:5432/checkly_test#" .env
          sed -i "s#^AUTH_SECRET=.*#AUTH_SECRET=$(openssl rand -hex 32)#" .env
          sed -i "s#^CRON_SECRET=.*#CRON_SECRET=ci-secret#" .env
          sed -i "s#^VAPID_PUBLIC_KEY=.*#VAPID_PUBLIC_KEY=$vapid_public#" .env
          sed -i "s#^VAPID_PRIVATE_KEY=.*#VAPID_PRIVATE_KEY=$vapid_private#" .env
          sed -i "s#^VAPID_SUBJECT=.*#VAPID_SUBJECT=mailto:ci@example.com#" .env
          sed -i "s#^NEXT_PUBLIC_VAPID_PUBLIC_KEY=.*#NEXT_PUBLIC_VAPID_PUBLIC_KEY=$vapid_public#" .env
      - run: pnpm db:push:test
      - run: pnpm storage:init
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, checkly]
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: /home/checkly
    steps:
      - run: git pull --ff-only
      - run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Health check
        run: |
          for i in $(seq 1 18); do
            curl -sf -o /dev/null -H "Host: checkly.cybercraft.az" http://localhost:80/login && { echo healthy; exit 0; }
            sleep 5
          done
          docker compose -f docker-compose.prod.yml logs --tail 50 migrate app
          exit 1
      - if: always()
        run: docker compose -f docker-compose.prod.yml ps
      - if: success()
        run: docker image prune -f
